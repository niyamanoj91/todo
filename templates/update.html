<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Application</title>

    <style>

        body{
            background-color: rgb(112, 30, 8);
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1{
            color: white;
            text-align: center;
            margin-top: 30px;
        }

        .crud{
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 50px;
            flex-wrap: wrap;
        }
        button{
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        form{
            display: flex;
            flex-direction: column;
            padding: 30px;
            width: 300px;
            border: 2px solid white;
            border-radius: 10px;
            background-color: rgba(255,255,255,0.1);
            color: white;
        }

        form input{
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>CRUD APPLICATION</h1>

    <div class="crud">

        <div class="form-container">
            <form method="POST">

                <h2>Update Course</h2>

                {% csrf_token %}

                <label>Course</label>
                <input type="text" name="course" value="{{b.course}}">

                <label>Fees</label>
                <input type="number" name="fees" value="{{b.fees}}">

                <button type="submit">Submit</button>

            </form>
        </div>
    </div>
</body>
</html>
