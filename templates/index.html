<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=fr, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: rgb(112, 30, 8);
    }
    form{
        display: flex;
        flex-direction: column;
        margin-top: 100px;
        text-align: center;
        padding: 90px;
        max-width:100px ;
        border: 1px solid rgb(255, 255, 255);
        color: white;
    }
    .form-container{
       display: flex;
       justify-content: center; 
    }
    button{
        font-size: large;
    }
    .table-container{
        display: flex;
        justify-content: center;
        margin: 100px;
    }
    .container{
        display: flex;
        justify-content: center;
        flex-direction: column;
        margin-top: 100px;
        text-align: center;
        max-width:100px ;
    }
    table{
        color: white;
    }
</style>
<body>
    <div class="form-container">
        <form method="POST" >
            {% csrf_token %}
            <label for="">Course</label>
            <input type="text" name="course"><br>
            <label for="">Fees</label>
            <input type="number" name="fees"><br>
            <button>Submit</button>
        </form>
    </div>
    <div class="table-container">
        <table border="1px solid white">
            <tr>
                <th>course</th>
                <th>fees</th>
                <th>Action</th>
            </tr>
            {% for i in a %}
            <tr>
                <td>{{i.course}}</td>
                <td>{{i.fees}}</td>
                <td><a href="{% url 'delete_djann' i.id %}">DELETE</a>
                <a href="{% url 'update_djann' i.id %}">UPDATE</a></td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
