<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Application</title>

    <style>

        body{
            background-color: rgb(112, 30, 8);
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1{
            color: white;
            text-align: center;
            margin-top: 30px;
        }

        .crud{
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        form{
            display: flex;
            flex-direction: column;
            padding: 30px;
            width: 300px;
            border: 2px solid white;
            border-radius: 10px;
            background-color: rgba(255,255,255,0.1);
            color: white;
        }

        form input{
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
        }

        button{
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            opacity: 0.8;
        }

        table{
            border-collapse: collapse;
            color: white;
            min-width: 400px;
        }

        table th,
        table td{
            border: 1px solid white;
            padding: 12px;
            text-align: center;
        }

        .table-container{
            overflow-x: auto;
        }

        a{
            text-decoration: none;
        }

    </style>
</head>

<body>

    <h1>CRUD APPLICATION</h1>

    <div class="crud">

        <div class="form-container">
            <form method="POST">

                <h2>Add Course</h2>

                {% csrf_token %}

                <label>Course</label>
                <input type="text" name="course">

                <label>Fees</label>
                <input type="number" name="fees">

                <button type="submit">Submit</button>

            </form>
        </div>

        <div class="table-container">

            <table>

                <tr>
                    <th>Course</th>
                    <th>Fees</th>
                    <th>Action</th>
                </tr>

                {% for i in a %}

                <tr>
                    <td>{{i.course}}</td>
                    <td>{{i.fees}}</td>

                    <td>
                        <a href="{% url 'delete_djann' i.id %}">
                            <button type="button">Delete</button>
                        </a>

                        <a href="{% url 'update_djann' i.id %}">
                            <button type="button">Update</button>
                        </a>
                    </td>
                </tr>

                {% endfor %}

            </table>

        </div>

    </div>

</body>
</html>
